name: Generate Root App starter

on:
  push:
    branches: [master]
    paths:
      - "rootapp/GENERATE_STARTER"

permissions:
  contents: write

concurrency:
  group: rootapp-starter-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ""

      - name: Generate official Root App template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/root-template"
          cd "$RUNNER_TEMP/root-template"
          npx --yes @rootsdk/create-root@1.0.4 --app spidey-bot-root
          test -d spidey-bot-root
          test -f spidey-bot-root/package.json
          test -f spidey-bot-root/root-manifest.json

      - name: Install and build generated template
        working-directory: ${{ runner.temp }}/root-template/spidey-bot-root
        run: |
          npm install
          npm run build

      - name: Copy generated source into rootapp
        shell: bash
        run: |
          set -euo pipefail
          rsync -a \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.pkg' \
            "$RUNNER_TEMP/root-template/spidey-bot-root/" rootapp/

      - name: Commit generated Root App project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rootapp
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Generate official SPIDEY BOT Root App starter"
          git push origin HEAD:master
