name: Staging audit
on:
  push:
    branches: [dashboard-local-dev-no-oauth]
  pull_request:
    branches: [dashboard-local-dev-no-oauth]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check index.cjs
      - run: node --check public/dashboard-app.js
      - run: find src -type f \( -name '*.cjs' -o -name '*.js' \) -print0 | xargs -0 -n1 node --check
