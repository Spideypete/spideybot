<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="/spideybot-logo.png?v=2">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>SPIDEY BOT Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .login-container {
      text-align: center;
      padding: 3rem;
      background: rgba(145, 70, 255, 0.1);
      border: 2px solid rgba(145, 70, 255, 0.3);
      border-radius: 15px;
      max-width: 400px;
    }
    h1 {
      margin-bottom: 1rem;
      font-size: 2rem;
      background: linear-gradient(135deg, #fff 0%, #9146FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      color: #aaa;
      margin-bottom: 2rem;
      font-size: 1rem;
    }
    .btn-discord {
      display: inline-block;
      padding: 1rem 2rem;
      background: #5865F2;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1.1rem;
      transition: all 0.3s;
      border: none;
      cursor: pointer;
    }
    .btn-discord:hover {
      background: #4752C4;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(88, 101, 242, 0.3);
    }
  .brand-login img{display:block;width:auto;max-width:min(280px,80vw);height:78px;object-fit:contain;margin:0 auto}
  </style>
</head>
<body>
  <div class="login-container">
    <h1 class="brand-login"><img src="/spideybot-logo.png" alt="SPIDEY BOT"></h1>
    <p>Admin Dashboard - Login with Discord</p>
    <a href="/auth/discord" class="btn-discord">Login with Discord</a>
  </div>
<script>
(function applyLogoWordmarkEverywhere(){
  if (window.__spideyLogoWordmarkInstalled) return;
  window.__spideyLogoWordmarkInstalled = true;
  const style = document.createElement('style');
  style.textContent = '.brand-inline-logo{display:inline-block;width:auto;max-width:160px;height:1.15em;object-fit:contain;vertical-align:-.2em}';
  document.head.appendChild(style);
  const pattern = /spidey\s+bot/ig;
  function replaceInTextNode(node){
    if(!node || node.nodeType !== Node.TEXT_NODE || !pattern.test(node.nodeValue || '')) { pattern.lastIndex = 0; return; }
    pattern.lastIndex = 0;
    const value = node.nodeValue;
    const fragment = document.createDocumentFragment();
    let last = 0, match;
    while((match = pattern.exec(value)) !== null){
      if(match.index > last) fragment.appendChild(document.createTextNode(value.slice(last, match.index)));
      const logo = document.createElement('img');
      logo.className = 'brand-inline-logo';
      logo.src = '/spideybot-logo.png';
      logo.alt = match[0];
      fragment.appendChild(logo);
      last = match.index + match[0].length;
    }
    if(last < value.length) fragment.appendChild(document.createTextNode(value.slice(last)));
    node.parentNode?.replaceChild(fragment, node);
  }
  function scan(root){
    if(!root) return;
    if(root.nodeType === Node.TEXT_NODE) { replaceInTextNode(root); return; }
    if(root.nodeType !== Node.ELEMENT_NODE && root.nodeType !== Node.DOCUMENT_NODE) return;
    if(root.nodeType === Node.ELEMENT_NODE && /^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA|TITLE|OPTION)$/i.test(root.tagName)) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        const p=node.parentElement;
        if(!p || /^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA|TITLE|OPTION)$/i.test(p.tagName)) return NodeFilter.FILTER_REJECT;
        if(p.closest('script,style,noscript,textarea,title,option')) return NodeFilter.FILTER_REJECT;
        return /spidey\s+bot/i.test(node.nodeValue || '') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(replaceInTextNode);
  }
  scan(document.body);
  new MutationObserver(records => records.forEach(record => {
    record.addedNodes?.forEach(node => scan(node));
    if(record.type === 'characterData') scan(record.target);
  })).observe(document.body,{subtree:true,childList:true,characterData:true});
})();
</script>
</body>
</html>
