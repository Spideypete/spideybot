<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPIDEY BOT Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .login-container {
      background: rgba(20, 20, 20, 0.8);
      border: 2px solid #9146FF;
      border-radius: 12px;
      padding: 3rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(145, 70, 255, 0.3);
      backdrop-filter: blur(10px);
    }
    .logo-section {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo-section img {
      height: 60px;
      margin-bottom: 1rem;
    }
    .logo-section h1 {
      font-size: 1.8rem;
      color: #9146FF;
      margin-bottom: 0.5rem;
    }
    .logo-section p {
      color: #aaa;
      font-size: 0.9rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #ddd;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.9rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(145, 70, 255, 0.3);
      border-radius: 8px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      transition: all 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #9146FF;
      box-shadow: 0 0 10px rgba(145, 70, 255, 0.3);
    }
    .form-group input::placeholder {
      color: #666;
    }
    .btn {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, #9146FF 0%, #7C3AED 100%);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(145, 70, 255, 0.4);
    }
    .error {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid #ff6b6b;
      color: #ff6b6b;
      padding: 0.8rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      text-align: center;
      font-size: 0.9rem;
      display: none;
    }
    .error.show {
      display: block;
    }
    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #666;
    }
    .footer a {
      color: #9146FF;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-section">
      <img src="/assets/spidey-logo.png" alt="SPIDEY BOT">
      <h1>SPIDEY BOT</h1>
      <p>Admin Dashboard</p>
    </div>

    <div class="error" id="errorMsg">❌ Invalid username or password</div>

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="admin" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn">Login</button>
    </form>

    <div class="footer">
      <p>🕷️ SPIDEY BOT Admin Panel</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error')) {
      document.getElementById('errorMsg').classList.add('show');
    }
  </script>
</body>
</html>
